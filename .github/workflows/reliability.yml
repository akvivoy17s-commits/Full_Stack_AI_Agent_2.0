name: Reliability checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-core:
    runs-on: ubuntu-latest
    env:
      MOCK_LLM: "1"
      USE_BROWSER: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install agent dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run reliability and regression tests
        run: >-
          pytest -q
          tests/test_project_verifier.py
          tests/test_project_files_hardening.py
          tests/test_phase1_hardening.py
          tests/test_phase2_runner.py
          tests/test_phase1_backend.py
          tests/test_phase3_pipeline.py
          tests/test_security_phase1.py
          tests/test_backend_api.py
          tests/test_autopilot.py
          tests/test_quality_gate.py
          tests/test_language_analyzer.py
          tests/test_autopilot_build_diagnostics.py
          tests/test_generated_tsx_source_guard.py
          tests/test_debugger_missing_diagnostic_target.py
          tests/test_missing_module_scaffold_recovery.py
          tests/test_checkpoint.py
          tests/test_repair_reverification_gate.py
          tests/test_phase6_selfrepair.py
          tests/test_phase6_autobuild_repair.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Type-check and build frontend
        run: npm --prefix frontend run build
      - name: Lint frontend
        run: npm --prefix frontend run lint
