# Values come from the environment (see .env.example); a local .env file is read too (KEY=VALUE lines).
spring.config.import=optional:file:.env[.properties]
spring.application.name=api
spring.main.banner-mode=off
server.port=${PORT:8000}
server.address=${HOST:127.0.0.1}
server.error.whitelabel.enabled=false
server.server-header=
server.tomcat.max-http-form-post-size=100KB
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.jackson.deserialization.fail-on-unknown-properties=false
app.env=${APP_ENV:development}
app.cors-origins=${CORS_ORIGINS:}
app.trust-proxy=${TRUST_PROXY:0}
